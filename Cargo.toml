[package]
name = "rusty-moss"
version = "0.3.0"
authors = ["dwaris <dwaris@itclowd.de>"]
license = "MIT"
edition = "2024"

[dependencies]
poise = { version = "0.7.1", default-features = false, features = ["cache", "chrono", "handle_panics"] }
serenity = { version = "0.12.5", default-features = false, features = ["native_tls_backend"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
moka = { version = "0.12", default-features = false, features = ["future"] }
