[package]
name = "rusty-moss"
version = "0.3.0"
authors = ["dwaris <dwaris@itclowd.de>"]
license = "MIT"
edition = "2024"

[dependencies]
poise = "0.7.0"
dotenvy = "0.15"
env_logger = "0.11.11"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.10"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1.0"
